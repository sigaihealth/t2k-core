name: Release T2K MCP

on:
  push:
    tags:
      - "mcp-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: t2k_reference_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d t2k_reference_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
        ports:
          - 5432:5432
    concurrency:
      group: npm-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fetch protected main branch
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - name: Verify GitHub release tag signature
        id: github-release-tag
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        with:
          script: |
            const tagName = process.env.RELEASE_TAG;
            const tagRef = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `tags/${tagName}`,
            });
            if (tagRef.data.object.type !== "tag") {
              throw new Error(`Release tag ${tagName} must be annotated; lightweight tags are not publishable.`);
            }

            const tagObjectSha = tagRef.data.object.sha;
            const response = await github.rest.git.getTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_sha: tagObjectSha,
            });
            const tag = response.data;
            if (tag.tag !== tagName) {
              throw new Error(`Annotated tag object names ${tag.tag}, expected ${tagName}.`);
            }
            if (tag.object.type !== "commit") {
              throw new Error(`Release tag ${tagName} must point directly to a commit.`);
            }
            if (!tag.verification?.verified) {
              throw new Error(
                `GitHub did not verify the signature for ${tagName}: ${tag.verification?.reason ?? "missing verification"}.`
              );
            }

            core.setOutput("tag-object-sha", tagObjectSha);
            core.setOutput("commit-sha", tag.object.sha);
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.17.0
      - run: npm --version
      - run: npm ci
      - run: npm run check
      - run: npm run check:postgres
        env:
          T2K_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/t2k_reference_test
      - name: Verify MCP release gate
        run: npm run release:verify --workspace @t2kai/mcp
        env:
          T2K_RELEASE_COMMIT_SHA: ${{ steps.github-release-tag.outputs.commit-sha }}
          T2K_RELEASE_MAIN_REF: refs/remotes/origin/main
          T2K_RELEASE_TAG_OBJECT_SHA: ${{ steps.github-release-tag.outputs.tag-object-sha }}
      - run: npm publish --workspace @t2kai/mcp --access public --provenance
